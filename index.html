<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPA Tracker Pro</title>
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --surface2: #2a2a2a;
      --border: #333333;
      --text: #e0e0e0;
      --text2: #a0a0a0;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #10b981;
      --radius-sm: 6px;
      --radius-md: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; max-width: 1200px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    h1 { font-size: 20px; font-weight: 700; color: #fff; }
    
    .d-day-badge { background: #2563eb; color: #fff; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }
    .goal-text { font-size: 13px; color: var(--text2); margin-left: 8px; }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .tab-btn { background: none; border: none; color: var(--text2); padding: 8px 16px; cursor: pointer; font-size: 14px; font-weight: 600; border-radius: var(--radius-sm); }
    .tab-btn.active { background: var(--surface2); color: var(--accent); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Dashboard Styles */
    .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; }
    .card-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; color: #fff; }

    /* Progress Matrix Table */
    .matrix-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .matrix-table th, .matrix-table td { border: 1px solid var(--border); padding: 8px; text-align: center; }
    .matrix-table th { background: var(--surface2); color: var(--text); }
    .matrix-select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 4px; border-radius: 4px; width: 100%; }

    /* Forms & Inputs */
    .form-group { margin-bottom: 12px; }
    .form-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; display: block; }
    .form-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; color: var(--text); outline: none; }
    
    .btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; }
    .btn-primary { background: var(--accent); border: none; color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
  </style>
</head>
<body>

  <header>
    <div>
      <span style="font-size: 20px; font-weight: 700; color: #fff;">CPA Tracker Pro</span>
      <span class="goal-text">2027년 동차 합격 목표</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <span id="dDayDisplay" class="d-day-badge">D-DAY</span>
    </div>
  </header>

  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('dashboard')">대시보드</button>
    <button class="tab-btn" onclick="switchTab('records')">공부기록</button>
    <button class="tab-btn" onclick="switchTab('scheduler')">스케줄러</button>
  </nav>

  <!-- 대시보드 탭 -->
  <div id="tab-dashboard" class="tab-content active">
    <div class="dashboard-grid">
      <div class="card">
        <div class="card-title">총괄 진도표</div>
        <div style="overflow-x: auto;">
          <table class="matrix-table">
            <thead>
              <tr>
                <th>하위과목</th>
                <th>연습서인강</th>
                <th>연습서문풀</th>
                <th>객관식</th>
                <th>객기출</th>
                <th>객모고</th>
                <th>기타</th>
              </tr>
            </thead>
            <tbody id="matrixTbody">
              <!-- JS 로드 -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 공부기록 탭 -->
  <div id="tab-records" class="tab-content">
    <div class="card">
      <div class="card-title">공부기록 관리</div>
      <p style="font-size:13px; color:var(--text2);">기록 관리 페이지 내용</p>
    </div>
  </div>

  <!-- 스케줄러 탭 -->
  <div id="tab-scheduler" class="tab-content">
    <div class="card">
      <div class="card-title">스케줄러</div>
      <p style="font-size:13px; color:var(--text2);">스케줄러 페이지 내용</p>
    </div>
  </div>

  <script>
    // Target Date: 2027-02-28
    const TARGET_DATE_STR = "2027-02-28";
    
    const subSubjects = [
      "중급회계", "고급회계", "원가관리회계", "정부회계", 
      "법인세법", "소득세법", "부가가치세법", "상법", "경영학", "경제학"
    ];
    
    const stages = ["연습서인강", "연습서문풀", "객관식", "객기출", "객모고", "기타"];
    const statusOptions = ["(해당없음)", "완료", "1회독", "2회독", "3회독", "4회독", "5회독"];

    let matrixData = JSON.parse(localStorage.getItem('cpaMatrixData') || '{}');

    function updateDDay() {
      const target = new Date(TARGET_DATE_STR + "T00:00:00");
      const today = new Date();
      today.setHours(0,0,0,0);
      
      const diffTime = target - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      
      const displayElem = document.getElementById('dDayDisplay');
      if (diffDays >= 0) {
        displayElem.innerText = `D-${diffDays} (${TARGET_DATE_STR})`;
      } else {
        displayElem.innerText = `D+${Math.abs(diffDays)} (${TARGET_DATE_STR})`;
      }
    }

    function renderMatrix() {
      const tbody = document.getElementById('matrixTbody');
      tbody.innerHTML = '';

      subSubjects.forEach(sub => {
        const tr = document.createElement('tr');
        
        const tdSub = document.createElement('td');
        tdSub.style.fontWeight = 'bold';
        tdSub.innerText = sub;
        tr.appendChild(tdSub);

        stages.forEach(stage => {
          const td = document.createElement('td');
          const select = document.createElement('select');
          select.className = 'matrix-select';
          
          const key = `${sub}_${stage}`;
          const currentValue = matrixData[key] || "(해당없음)";

          statusOptions.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt;
            option.innerText = opt;
            if (opt === currentValue) option.selected = true;
            select.appendChild(option);
          });

          select.onchange = (e) => {
            matrixData[key] = e.target.value;
            localStorage.setItem('cpaMatrixData', JSON.stringify(matrixData));
          };

          td.appendChild(select);
          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(`tab-${tabName}`).classList.add('active');
    }

    window.onload = function() {
      updateDDay();
      renderMatrix();
    };
  </script>
</body>
</html>
