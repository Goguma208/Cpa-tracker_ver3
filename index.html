<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CPA 트래커 Pro</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222636;
    --border: #2e3348;
    --text: #e8eaf0;
    --text2: #8b90a7;
    --text3: #4a4f6a;
    --accent: #5b7fff;
    --accent2: #3d5cdb;
    --green: #3ecf8e;
    --red: #ff6b6b;
    --yellow: #ffd166;
    --purple: #b388ff;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, 'Pretendard', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 80px;
  }

  .top-bar {
    padding: 20px 20px 16px;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .top-bar h1 { font-size: 18px; font-weight: 700; }
  .top-bar .sub { font-size: 11px; color: var(--text2); margin-top: 2px; }

  .tab-bar {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tab-bar::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex: 1;
    min-width: 60px;
    padding: 12px 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text3);
    background: none;
    border: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
    white-space: nowrap;
    text-align: center;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  .page { display: none; padding: 16px 20px; }
  .page.active { display: block; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }

  .section-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text2);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin: 16px 0 8px;
  }

  .btn {
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    border: none;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn:active { opacity: 0.75; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-ghost { background: var(--surface2); color: var(--text); }
  .btn-danger { background: rgba(255,107,107,0.15); color: var(--red); }
  .btn-sm { padding: 4px 8px; font-size: 11px; }

  .dday-card {
    background: linear-gradient(135deg, #1e2a5e 0%, #2d1f5e 100%);
    border: 1px solid #3d4a8a;
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .dday-num { font-size: 36px; font-weight: 800; color: var(--accent); line-height: 1; }
  .dday-label { font-size: 11px; color: var(--text2); margin-top: 4px; }
  .dday-right { text-align: right; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-item {
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 12px;
    text-align: center;
  }
  .stat-num { font-size: 20px; font-weight: 800; }
  .stat-label { font-size: 11px; color: var(--text2); margin-top: 2px; }

  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .bc-item {
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    padding: 3px 6px;
    border-radius: 4px;
    background: var(--surface2);
  }
  .bc-sep { font-size: 10px; color: var(--text3); }
  .bc-current { font-size: 12px; color: var(--text); font-weight: 600; }

  .list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
  }
  .action-btns { display: flex; gap: 4px; }

  .filter-bar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
    background: var(--surface);
    padding: 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }
  .filter-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .filter-label { font-size: 11px; color: var(--text2); font-weight: bold; width: 45px; }
  .filter-chip {
    padding: 4px 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 11px;
    color: var(--text2);
    cursor: pointer;
    user-select: none;
  }
  .filter-chip.active { background: var(--accent); color: white; border-color: var(--accent); }

  .prob-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    margin-bottom: 8px;
  }
  .prob-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .prob-num { font-size: 14px; font-weight: 700; }
  .history-list { font-size: 11px; color: var(--text2); border-top: 1px dashed var(--border); padding-top: 6px; margin-top: 6px; }
  .history-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; padding: 2px 0; }

  .sub-tab-bar { display: flex; gap: 6px; margin-bottom: 12px; }
  .sub-tab-btn {
    flex: 1; padding: 8px; font-size: 11px; font-weight: bold; text-align: center;
    background: var(--surface2); color: var(--text2); border-radius: var(--radius-sm);
    border: 1px solid var(--border); cursor: pointer;
  }
  .sub-tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

  /* 캘린더 전용 스타일 */
  .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-day-head { font-size: 11px; font-weight: bold; color: var(--text2); padding: 4px 0; }
  .cal-cell {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    min-height: 52px; padding: 4px 2px; font-size: 10px; display: flex; flex-direction: column; align-items: center;
  }
  .cal-cell.today { border-color: var(--accent); background: rgba(91,127,255,0.1); }
  .cal-cell .date-num { font-weight: bold; margin-bottom: 2px; }
  .cal-dot { width: 4px; height: 4px; background: var(--accent); border-radius: 50%; margin-top: 2px; }
  .cal-task-text { font-size: 8px; color: var(--text2); text-overflow: ellipsis; overflow: hidden; white-space: nowrap; max-width: 100%; }

  .weekly-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; margin-bottom: 8px; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 200;
    align-items: flex-end;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 16px 16px 0 0;
    padding: 20px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .form-group { margin-bottom: 12px; }
  .form-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; display: block; }
  .form-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    font-size: 13px;
    color: var(--text);
    outline: none;
  }

  .days-checkboxes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .day-chk { display: none; }
  .day-lbl {
    padding: 6px 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
  }
  .day-chk:checked + .day-lbl { background: var(--accent); color: white; border-color: var(--accent); }
</style>
</head>
<body>

<div class="top-bar">
  <div>
    <h1>📚 CPA 트래커 Pro</h1>
    <div class="sub">2027년 1차 합격 목표</div>
  </div>
  <div>
    <button class="btn btn-sm btn-ghost" onclick="resetToDefault()">🔄 초기화</button>
    <button class="btn btn-sm btn-ghost" onclick="exportData()">💾 백업</button>
    <button class="btn btn-sm btn-ghost" onclick="importData()">📂 복구</button>
  </div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="showPage('dashboard')">대시보드</button>
  <button class="tab-btn" onclick="showPage('study')">공부기록</button>
  <button class="tab-btn" onclick="showPage('scheduler')">스케줄러</button>
  <button class="tab-btn" onclick="showPage('calendar')">캘린더</button>
</div>

<!-- 대시보드 -->
<div id="page-dashboard" class="page active">
  <div class="dday-card">
    <div>
      <div class="dday-num" id="ddayNum">—</div>
      <div class="dday-label">일 남음</div>
    </div>
    <div class="dday-right">
      <div style="font-size:12px;color:var(--text2);" id="todayDate"></div>
      <div style="font-size:14px;font-weight:700;">CPA 1차 시험</div>
    </div>
  </div>

  <div class="section-title">전체 공부 현황</div>
  <div class="stat-grid">
    <div class="stat-item"><div class="stat-num" id="statTotal">0</div><div class="stat-label">등록된 문제</div></div>
    <div class="stat-item"><div class="stat-num" id="statSolved" style="color:var(--green)">0</div><div class="stat-label">풀이한 문제</div></div>
  </div>
</div>

<!-- 공부기록 -->
<div id="page-study" class="page">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="studyList"></div>
</div>

<!-- 스케줄러 -->
<div id="page-scheduler" class="page">
  <div class="card">
    <div style="font-weight:700;margin-bottom:12px;">📅 자동 강좌/분량 배분기</div>
    <div class="form-group">
      <label class="form-label">목표/강좌명</label>
      <input type="text" class="form-input" id="schTitle" placeholder="예: 중급회계 연습서 인강">
    </div>
    <div class="form-group">
      <label class="form-label">총 분량 (강 수 또는 페이지)</label>
      <input type="number" class="form-input" id="schTotal" placeholder="예: 45">
    </div>
    <div class="form-group">
      <label class="form-label">시작일 ~ 종료일</label>
      <div style="display:flex;gap:6px;">
        <input type="date" class="form-input" id="schStart">
        <input type="date" class="form-input" id="schEnd">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">공부 요일 지정</label>
      <div class="days-checkboxes">
        <input type="checkbox" id="d1" class="day-chk" value="1" checked><label for="d1" class="day-lbl">월</label>
        <input type="checkbox" id="d2" class="day-chk" value="2"><label for="d2" class="day-lbl">화</label>
        <input type="checkbox" id="d3" class="day-chk" value="3" checked><label for="d3" class="day-lbl">수</label>
        <input type="checkbox" id="d4" class="day-chk" value="4"><label for="d4" class="day-lbl">목</label>
        <input type="checkbox" id="d5" class="day-chk" value="5" checked><label for="d5" class="day-lbl">금</label>
        <input type="checkbox" id="d6" class="day-chk" value="6"><label for="d6" class="day-lbl">토</label>
        <input type="checkbox" id="d0" class="day-chk" value="0"><label for="d0" class="day-lbl">일</label>
      </div>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="generateSchedule()">일정 생성 후 캘린더에 추가</button>
  </div>
</div>

<!-- 캘린더 -->
<div id="page-calendar" class="page">
  <div class="sub-tab-bar">
    <div class="sub-tab-btn active" id="calTabDaily" onclick="setCalView('daily')">Daily</div>
    <div class="sub-tab-btn" id="calTabWeekly" onclick="setCalView('weekly')">Weekly</div>
    <div class="sub-tab-btn" id="calTabMonthly" onclick="setCalView('monthly')">Monthly</div>
  </div>
  <div id="calList"></div>
</div>

<!-- 문제 풀이 기록 추가/수정 모달 -->
<div class="modal-overlay" id="probModal">
  <div class="modal">
    <div style="font-weight:700;margin-bottom:12px;" id="probModalTitle">문제 기록 추가</div>
    <div class="form-group">
      <label class="form-label">회독 선택</label>
      <select class="form-input" id="probRound">
        <option value="1">1회독</option>
        <option value="2">2회독</option>
        <option value="3">3회독</option>
        <option value="4">4회독</option>
        <option value="5">5회독</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">상태</label>
      <select class="form-input" id="probStatus">
        <option value="O">O (맞음)</option>
        <option value="△">△ (실수)</option>
        <option value="☆">☆ (오답)</option>
        <option value="♥">♥ (다시풀기)</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">풀이 날짜</label>
      <input type="date" class="form-input" id="probDate">
    </div>
    <div class="form-group">
      <label class="form-label">메모</label>
      <input type="text" class="form-input" id="probMemo" placeholder="오답 이유, 풀이 시간 등">
    </div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn-ghost" style="flex:1" onclick="closeModal('probModal')">취소</button>
      <button class="btn btn-primary" style="flex:1" onclick="saveProbRecord()">기록 저장</button>
    </div>
  </div>
</div>

<script>
const DEFAULT_STRUCTURE = {
  "경영학": {
    "일반경영": ["객관식 기출", "모의고사"],
    "재무관리": ["연습서 문풀", "객관식 기출"]
  },
  "경제학": {
    "미시경제": ["객관식 기출"],
    "거시경제": ["객관식 기출"]
  },
  "상법": {
    "회사법": ["객관식 기출", "조문 암기"],
    "어음수표법/기타법": ["객관식 기출"]
  },
  "세법": {
    "법인세": ["연습서 문풀", "객관식 기출"],
    "소득세": ["연습서 문풀", "객관식 기출"],
    "부가가치세": ["연습서 문풀", "객관식 기출"],
    "기타세법": ["객관식 기출"]
  },
  "회계학": {
    "중급회계": ["연습서 문풀", "객관식 기출"],
    "고급회계": ["연습서 인강", "객관식 기출"],
    "원가관리회계": ["연습서 문풀"],
    "정부회계": ["객관식 기출"]
  }
};

function getStructure() {
  const data = localStorage.getItem('cpaStructure');
  return data ? JSON.parse(data) : DEFAULT_STRUCTURE;
}
function saveStructure(struct) {
  localStorage.setItem('cpaStructure', JSON.stringify(struct));
}
function getData() {
  return JSON.parse(localStorage.getItem('cpaRecords') || '{}');
}
function saveData(data) {
  localStorage.setItem('cpaRecords', JSON.stringify(data));
}

function resetToDefault() {
  if (confirm('과목 구조를 CPA 1차 전체 기본 과목 구조로 초기화하시겠습니까?')) {
    localStorage.removeItem('cpaStructure');
    location.reload();
  }
}

let studyPath = [];
let selectedRounds = [];
let selectedStatuses = [];
let calViewMode = 'daily';
let currentCalDate = new Date();

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  if (id === 'dashboard') renderDashboard();
  if (id === 'study') renderStudy();
  if (id === 'calendar') renderCalendar();
}

function renderDashboard() {
  const exam = new Date('2027-02-28');
  const diff = Math.ceil((exam - new Date()) / 86400000);
  document.getElementById('ddayNum').textContent = diff;

  const records = getData();
  let total = 0, solved = 0;
  Object.values(records).forEach(item => {
    total++;
    if (item.history && item.history.length > 0) solved++;
  });
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statSolved').textContent = solved;
}

function renderStudy() {
  const struct = getStructure();
  const bc = document.getElementById('breadcrumb');
  const list = document.getElementById('studyList');

  let bcHtml = '<span class="bc-item" onclick="navTo([])">전체 과목</span>';
  studyPath.forEach((p, i) => {
    bcHtml += ' <span class="bc-sep">›</span> ';
    bcHtml += i < studyPath.length - 1 
      ? `<span class="bc-item" onclick="navTo(studyPath.slice(0,${i+1}))">${p}</span>`
      : `<span class="bc-current">${p}</span>`;
  });
  bc.innerHTML = bcHtml;
  list.innerHTML = '';

  const depth = studyPath.length;

  if (depth === 0) {
    list.innerHTML += `<button class="btn btn-ghost" style="width:100%;margin-bottom:8px" onclick="addMainSubject()">+ 대과목 추가</button>`;
    const keys = Object.keys(struct);
    keys.forEach((subj, idx) => {
      const subCount = struct[subj] ? Object.keys(struct[subj]).length : 0;
      list.innerHTML += `<div class="list-item">
        <div onclick="navTo(['${subj}'])" style="flex:1;cursor:pointer">
          <strong>${subj}</strong> <span style="font-size:11px;color:var(--text2)">(${subCount}개)</span>
        </div>
        <div class="action-btns">
          <button class="btn btn-sm btn-ghost" onclick="moveMainSubject(${idx}, -1)">▲</button>
          <button class="btn btn-sm btn-ghost" onclick="moveMainSubject(${idx}, 1)">▼</button>
          <button class="btn btn-sm btn-ghost" onclick="editMainSubject('${subj}')">수정</button>
          <button class="btn btn-sm btn-danger" onclick="deleteMainSubject('${subj}')">삭제</button>
        </div>
      </div>`;
    });
  } 
  else if (depth === 1) {
    const subj = studyPath[0];
    list.innerHTML += `<button class="btn btn-ghost" style="width:100%;margin-bottom:8px" onclick="addSubSubject('${subj}')">+ 하위 과목 추가</button>`;
    
    const keys = Object.keys(struct[subj] || {});
    keys.forEach((sub, idx) => {
      list.innerHTML += `<div class="list-item">
        <div onclick="navTo(['${subj}','${sub}'])" style="flex:1;cursor:pointer"><strong>${sub}</strong></div>
        <div class="action-btns">
          <button class="btn btn-sm btn-ghost" onclick="moveSubSubject('${subj}', ${idx}, -1)">▲</button>
          <button class="btn btn-sm btn-ghost" onclick="moveSubSubject('${subj}', ${idx}, 1)">▼</button>
          <button class="btn btn-sm btn-ghost" onclick="editSubSubject('${subj}','${sub}')">수정</button>
          <button class="btn btn-sm btn-danger" onclick="deleteSubSubject('${subj}','${sub}')">삭제</button>
        </div>
      </div>`;
    });
  } 
  else if (depth === 2) {
    const [subj, sub] = studyPath;
    list.innerHTML += `<button class="btn btn-ghost" style="width:100%;margin-bottom:8px" onclick="addTask('${subj}','${sub}')">+ 태스크 추가</button>`;
    
    const tasks = struct[subj][sub] || [];
    tasks.forEach((task, idx) => {
      list.innerHTML += `<div class="list-item">
        <div onclick="navTo(['${subj}','${sub}','${task}'])" style="flex:1;cursor:pointer"><strong>${task}</strong></div>
        <div class="action-btns">
          <button class="btn btn-sm btn-ghost" onclick="moveTask('${subj}','${sub}', ${idx}, -1)">▲</button>
          <button class="btn btn-sm btn-ghost" onclick="moveTask('${subj}','${sub}', ${idx}, 1)">▼</button>
          <button class="btn btn-sm btn-ghost" onclick="editTask('${subj}','${sub}','${task}')">수정</button>
          <button class="btn btn-sm btn-danger" onclick="deleteTask('${subj}','${sub}','${task}')">삭제</button>
        </div>
      </div>`;
    });
  } 
  else if (depth === 3) {
    const [subj, sub, task] = studyPath;
    const pathKey = `${subj}|${sub}|${task}`;
    
    list.innerHTML = `
    <div class="filter-bar">
      <div class="filter-group">
        <span class="filter-label">회독:</span>
        ${['1','2','3','4','5'].map(r => `<div class="filter-chip ${selectedRounds.includes(r)?'active':''}" onclick="toggleFilterRound('${r}')">${r}회독</div>`).join('')}
      </div>
      <div class="filter-group">
        <span class="filter-label">상태:</span>
        ${['☆','♥','△','O'].map(s => `<div class="filter-chip ${selectedStatuses.includes(s)?'active':''}" onclick="toggleFilterStatus('${s}')">${s}</div>`).join('')}
      </div>
    </div>
    <button class="btn btn-ghost" style="width:100%;margin-bottom:12px" onclick="addProblem('${pathKey}')">+ 문제 추가 (예: 1-20 또는 5)</button>`;

    const records = getData();
    const probs = Object.keys(records).filter(k => k.startsWith(pathKey + '|'));

    probs.forEach(pKey => {
      const probNum = pKey.split('|')[3];
      const history = records[pKey].history || [];

      const matchedHistory = history.filter(h => {
        const roundMatch = selectedRounds.length === 0 || selectedRounds.includes(h.round);
        const statusMatch = selectedStatuses.length === 0 || selectedStatuses.includes(h.status);
        return roundMatch && statusMatch;
      });

      if ((selectedRounds.length > 0 || selectedStatuses.length > 0) && matchedHistory.length === 0) return;

      let historyHtml = history.map((h, idx) => {
        let termStr = '';
        if (idx > 0) {
          const prevDate = new Date(history[idx-1].date);
          const currDate = new Date(h.date);
          const diffDays = Math.round((currDate - prevDate) / (1000 * 3600 * 24));
          termStr = ` (${diffDays}일 텀)`;
        }
        return `<div class="history-item">
          <div><strong>${h.round}회독 [${h.status}]</strong> - ${h.date}${termStr} <span style="color:var(--text3)">${h.memo ? '| ' + h.memo : ''}</span></div>
          <div>
            <button class="btn btn-sm btn-ghost" onclick="openProbModal('${pKey}', ${idx})">수정</button>
            <button class="btn btn-sm btn-danger" onclick="deleteProbRecord('${pKey}', ${idx})">삭제</button>
          </div>
        </div>`;
      }).join('');

      list.innerHTML += `<div class="prob-card">
        <div class="prob-header">
          <div class="prob-num">${probNum}번 문제</div>
          <button class="btn btn-sm btn-primary" onclick="openProbModal('${pKey}')">+ 회독 기록</button>
        </div>
        <div class="history-list">${historyHtml || '풀이 기록 없음'}</div>
      </div>`;
    });
  }
}

function navTo(path) { studyPath = path; renderStudy(); }

function toggleFilterRound(r) {
  if (selectedRounds.includes(r)) selectedRounds = selectedRounds.filter(x => x !== r);
  else selectedRounds.push(r);
  renderStudy();
}
function toggleFilterStatus(s) {
  if (selectedStatuses.includes(s)) selectedStatuses = selectedStatuses.filter(x => x !== s);
  else selectedStatuses.push(s);
  renderStudy();
}

function moveArray(arr, from, to) {
  if (to < 0 || to >= arr.length) return;
  const item = arr.splice(from, 1)[0];
  arr.splice(to, 0, item);
}

function moveMainSubject(idx, dir) {
  const struct = getStructure();
  const keys = Object.keys(struct);
  if (idx + dir < 0 || idx + dir >= keys.length) return;
  const newStruct = {};
  moveArray(keys, idx, idx + dir);
  keys.forEach(k => newStruct[k] = struct[k]);
  saveStructure(newStruct);
  renderStudy();
}

function moveSubSubject(subj, idx, dir) {
  const struct = getStructure();
  const keys = Object.keys(struct[subj]);
  if (idx + dir < 0 || idx + dir >= keys.length) return;
  moveArray(keys, idx, idx + dir);
  const newSub = {};
  keys.forEach(k => newSub[k] = struct[subj][k]);
  struct[subj] = newSub;
  saveStructure(struct);
  renderStudy();
}

function moveTask(subj, sub, idx, dir) {
  const struct = getStructure();
  moveArray(struct[subj][sub], idx, idx + dir);
  saveStructure(struct);
  renderStudy();
}

function addMainSubject() {
  const name = prompt('새 대과목 이름 (예: 경제학, 세법 등)');
  if (!name) return;
  const struct = getStructure();
  if (!struct[name]) struct[name] = {};
  saveStructure(struct);
  renderStudy();
}
function editMainSubject(oldName) {
  const newName = prompt('변경할 대과목 이름:', oldName);
  if (!newName || newName === oldName) return;
  const struct = getStructure();
  struct[newName] = struct[oldName];
  delete struct[oldName];
  saveStructure(struct);

  const records = getData();
  const updated = {};
  Object.keys(records).forEach(k => {
    updated[k.startsWith(oldName + '|') ? k.replace(oldName + '|', newName + '|') : k] = records[k];
  });
  saveData(updated);
  renderStudy();
}
function deleteMainSubject(subj) {
  if (!confirm(`${subj} 과목과 하위 데이터 전체를 삭제하시겠습니까?`)) return;
  const struct = getStructure();
  delete struct[subj];
  saveStructure(struct);
  renderStudy();
}

function addSubSubject(subj) {
  const name = prompt('하위 과목 이름 (예: 중급회계 등)');
  if (!name) return;
  const struct = getStructure();
  if (!struct[subj][name]) struct[subj][name] = [];
  saveStructure(struct);
  renderStudy();
}
function editSubSubject(subj, oldName) {
  const newName = prompt('변경할 하위 과목 이름:', oldName);
  if (!newName || newName === oldName) return;
  const struct = getStructure();
  struct[subj][newName] = struct[subj][oldName];
  delete struct[subj][oldName];
  saveStructure(struct);

  const records = getData();
  const updated = {};
  const p = `${subj}|${oldName}|`, np = `${subj}|${newName}|`;
  Object.keys(records).forEach(k => {
    updated[k.startsWith(p) ? k.replace(p, np) : k] = records[k];
  });
  saveData(updated);
  renderStudy();
}
function deleteSubSubject(subj, sub) {
  if (!confirm(`${sub} 과목을 삭제하시겠습니까?`)) return;
  const struct = getStructure();
  delete struct[subj][sub];
  saveStructure(struct);
  renderStudy();
}

function addTask(subj, sub) {
  const name = prompt('태스크 이름 (예: 객관식 기출, 연습서)');
  if (!name) return;
  const struct = getStructure();
  struct[subj][sub].push(name);
  saveStructure(struct);
  renderStudy();
}
function editTask(subj, sub, oldName) {
  const newName = prompt('변경할 태스크 이름:', oldName);
  if (!newName || newName === oldName) return;
  const struct = getStructure();
  const idx = struct[subj][sub].indexOf(oldName);
  if (idx !== -1) struct[subj][sub][idx] = newName;
  saveStructure(struct);

  const records = getData();
  const updated = {};
  const p = `${subj}|${sub}|${oldName}|`, np = `${subj}|${sub}|${newName}|`;
  Object.keys(records).forEach(k => {
    updated[k.startsWith(p) ? k.replace(p, np) : k] = records[k];
  });
  saveData(updated);
  renderStudy();
}
function deleteTask(subj, sub, task) {
  const struct = getStructure();
  struct[subj][sub] = struct[subj][sub].filter(t => t !== task);
  saveStructure(struct);
  renderStudy();
}

function addProblem(pathKey) {
  const input = prompt('추가할 문제 번호/범위 입력 (예: 1-10 또는 5)');
  if (!input) return;
  const records = getData();
  if (input.includes('-')) {
    const [start, end] = input.split('-').map(Number);
    for (let i = start; i <= end; i++) {
      records[`${pathKey}|${i}`] = records[`${pathKey}|${i}`] || { history: [] };
    }
  } else {
    records[`${pathKey}|${input}`] = records[`${pathKey}|${input}`] || { history: [] };
  }
  saveData(records);
  renderStudy();
}

let targetProbKey = null;
let editingHistoryIndex = null;

function openProbModal(pKey, historyIndex = null) {
  targetProbKey = pKey;
  editingHistoryIndex = historyIndex;
  
  if (historyIndex !== null) {
    const records = getData();
    const item = records[pKey].history[historyIndex];
    document.getElementById('probModalTitle').textContent = '문제 기록 수정';
    document.getElementById('probRound').value = item.round;
    document.getElementById('probStatus').value = item.status;
    document.getElementById('probDate').value = item.date;
    document.getElementById('probMemo').value = item.memo || '';
  } else {
    document.getElementById('probModalTitle').textContent = '문제 기록 추가';
    document.getElementById('probDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('probMemo').value = '';
  }
  document.getElementById('probModal').classList.add('open');
}
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function saveProbRecord() {
  if (!targetProbKey) return;
  const records = getData();
  const round = document.getElementById('probRound').value;
  const status = document.getElementById('probStatus').value;
  const date = document.getElementById('probDate').value;
  const memo = document.getElementById('probMemo').value;

  if (!records[targetProbKey]) records[targetProbKey] = { history: [] };

  if (editingHistoryIndex !== null) {
    records[targetProbKey].history[editingHistoryIndex] = { round, status, date, memo };
  } else {
    records[targetProbKey].history.push({ round, status, date, memo });
  }

  records[targetProbKey].history.sort((a,b) => Number(a.round) - Number(b.round));
  saveData(records);
  closeModal('probModal');
  renderStudy();
}

function deleteProbRecord(pKey, idx) {
  if (!confirm('이 풀이 기록을 삭제하시겠습니까?')) return;
  const records = getData();
  records[pKey].history.splice(idx, 1);
  saveData(records);
  renderStudy();
}

function generateSchedule() {
  const title = document.getElementById('schTitle').value;
  const total = Number(document.getElementById('schTotal').value);
  const start = new Date(document.getElementById('schStart').value);
  const end = new Date(document.getElementById('schEnd').value);
  const selectedDays = Array.from(document.querySelectorAll('.day-chk:checked')).map(cb => Number(cb.value));

  if (!title || !total || isNaN(start) || isNaN(end) || selectedDays.length === 0) {
    alert('모든 단계를 정확히 입력해 주세요.');
    return;
  }

  let dates = [];
  let curr = new Date(start);
  while (curr <= end) {
    if (selectedDays.includes(curr.getDay())) dates.push(new Date(curr));
    curr.setDate(curr.getDate() + 1);
  }

  if (dates.length === 0) {
    alert('선택한 기간 내에 해당하는 공부 요일이 없습니다.');
    return;
  }

  const perDay = Math.ceil(total / dates.length);
  const todos = JSON.parse(localStorage.getItem('cpaSchedulerTodos') || '[]');

  let currentLesson = 1;
  dates.forEach(d => {
    if (currentLesson > total) return;
    const endLesson = Math.min(currentLesson + perDay - 1, total);
    todos.push({
      date: d.toISOString().split('T')[0],
      task: `${title} (${currentLesson}~${endLesson}강)`
    });
    currentLesson = endLesson + 1;
  });

  localStorage.setItem('cpaSchedulerTodos', JSON.stringify(todos));
  alert('일정이 성공적으로 생성되었습니다!');
  showPage('calendar');
}

// 캘린더 Daily / Weekly / Monthly 구현
function setCalView(mode) {
  calViewMode = mode;
  document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('calTab' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
  renderCalendar();
}

function changeMonth(offset) {
  currentCalDate.setMonth(currentCalDate.getMonth() + offset);
  renderCalendar();
}

function renderCalendar() {
  const todos = JSON.parse(localStorage.getItem('cpaSchedulerTodos') || '[]');
  const list = document.getElementById('calList');
  
  const todayStr = new Date().toISOString().split('T')[0];

  if (calViewMode === 'daily') {
    todos.sort((a,b) => new Date(a.date) - new Date(b.date));
    const futureTodos = todos.filter(t => t.date >= todayStr);
    
    if (futureTodos.length === 0) {
      list.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text2)">오늘 이후 남아있는 배분 일정이 없습니다.</div>';
      return;
    }

    list.innerHTML = futureTodos.map(t => `<div class="list-item">
      <div><strong>${t.date}</strong></div>
      <div>${t.task}</div>
    </div>`).join('');
  } 
  else if (calViewMode === 'weekly') {
    // 오늘 기준 해당 주(월~일) 구하기
    const curr = new Date();
    const first = curr.getDate() - curr.getDay() + (curr.getDay() === 0 ? -6 : 1);
    const monday = new Date(curr.setDate(first));

    let html = `<div style="font-weight:bold;margin-bottom:12px;color:var(--accent);text-align:center;">
      📅 이번 주 일정 (${monday.toISOString().split('T')[0]} ~ )
    </div>`;

    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      const dStr = d.toISOString().split('T')[0];
      const dayName = ['일','월','화','수','목','금','토'][d.getDay()];
      const dayTasks = todos.filter(t => t.date === dStr);

      html += `<div class="weekly-card">
        <div style="font-size:12px;font-weight:bold;color:${dStr===todayStr?'var(--accent)':'var(--text)'};margin-bottom:4px;">
          ${dStr} (${dayName}) ${dStr===todayStr?'[오늘]':''}
        </div>
        ${dayTasks.length > 0 
          ? dayTasks.map(t => `<div style="font-size:12px;color:var(--text2);margin-top:2px;">• ${t.task}</div>`).join('') 
          : '<div style="font-size:11px;color:var(--text3);">일정 없음</div>'}
      </div>`;
    }
    list.innerHTML = html;
  } 
  else if (calViewMode === 'monthly') {
    const year = currentCalDate.getFullYear();
    const month = currentCalDate.getMonth();
    
    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    let html = `
    <div class="cal-header">
      <button class="btn btn-sm btn-ghost" onclick="changeMonth(-1)">◀ 이전달</button>
      <strong style="font-size:14px;color:var(--accent)">${year}년 ${month + 1}월</strong>
      <button class="btn btn-sm btn-ghost" onclick="changeMonth(1)">다음달 ▶</button>
    </div>
    <div class="cal-grid">
      <div class="cal-day-head" style="color:var(--red)">일</div>
      <div class="cal-day-head">월</div>
      <div class="cal-day-head">화</div>
      <div class="cal-day-head">수</div>
      <div class="cal-day-head">목</div>
      <div class="cal-day-head">금</div>
      <div class="cal-day-head" style="color:var(--accent)">토</div>
    `;

    // 빈 날짜 채우기
    for (let i = 0; i < firstDay; i++) {
      html += `<div class="cal-cell" style="opacity:0.2"></div>`;
    }

    // 날짜 그리기
    for (let date = 1; date <= lastDate; date++) {
      const mStr = String(month + 1).padStart(2, '0');
      const dStr = String(date).padStart(2, '0');
      const fullDate = `${year}-${mStr}-${dStr}`;
      const isToday = fullDate === todayStr;

      const dayTasks = todos.filter(t => t.date === fullDate);

      html += `<div class="cal-cell ${isToday ? 'today' : ''}">
        <div class="date-num">${date}</div>
        ${dayTasks.length > 0 ? '<div class="cal-dot"></div>' : ''}
        ${dayTasks.map(t => `<div class="cal-task-text" title="${t.task}">${t.task}</div>`).join('')}
      </div>`;
    }

    html += `</div>`;
    list.innerHTML = html;
  }
}

function exportData() {
  const data = {
    struct: getStructure(),
    records: getData(),
    todos: JSON.parse(localStorage.getItem('cpaSchedulerTodos') || '[]')
  };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `CPA_Tracker_Backup_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.onchange = e => {
    const reader = new FileReader();
    reader.onload = event => {
      try {
        const parsed = JSON.parse(event.target.result);
        if (parsed.struct) saveStructure(parsed.struct);
        if (parsed.records) saveData(parsed.records);
        if (parsed.todos) localStorage.setItem('cpaSchedulerTodos', JSON.stringify(parsed.todos));
        alert('복구 완료!');
        location.reload();
      } catch { alert('올바른 백업 파일이 아닙니다.'); }
    };
    reader.readAsText(event.target.files[0]);
  };
  input.click();
}

renderDashboard();
