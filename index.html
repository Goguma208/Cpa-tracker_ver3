


<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CPA 트래커 Pro</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222636;
    --border: #2e3348;
    --text: #e8eaf0;
    --text2: #8b90a7;
    --text3: #4a4f6a;
    --accent: #5b7fff;
    --green: #3ecf8e;
    --red: #ff6b6b;
    --radius: 12px;
    --radius-sm: 8px;

    /* 과목별 파스텔 색상 정의 */
    --color-경영학-bg: rgba(34, 197, 94, 0.25);
    --color-경영학-border: #22c55e;
    --color-경영학-text: #86efac;

    --color-경제학-bg: rgba(249, 115, 22, 0.25);
    --color-경제학-border: #f97316;
    --color-경제학-text: #fdba74;

    --color-상법-bg: rgba(234, 179, 8, 0.25);
    --color-상법-border: #eab308;
    --color-상법-text: #fef08a;

    --color-세법-bg: rgba(14, 165, 233, 0.25);
    --color-세법-border: #0ea5e9;
    --color-세법-text: #7dd3fc;

    --color-회계학-bg: rgba(239, 68, 68, 0.25);
    --color-회계학-border: #ef4444;
    --color-회계학-text: #fca5a5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, 'Pretendard', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; max-width: 480px; margin: 0 auto; padding-bottom: 80px; }
  .top-bar { padding: 20px 20px 16px; background: var(--bg); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .top-bar h1 { font-size: 18px; font-weight: 700; }
  .top-bar .sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .tab-bar { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  .tab-bar::-webkit-scrollbar { display: none; }
  .tab-btn { flex: 1; min-width: 60px; padding: 12px 6px; font-size: 12px; font-weight: 600; color: var(--text3); background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent; text-align: center; }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .page { display: none; padding: 16px 20px; }
  .page.active { display: block; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .section-title { font-size: 11px; font-weight: 700; color: var(--text2); letter-spacing: 0.8px; text-transform: uppercase; margin: 16px 0 8px; }
  .btn { padding: 8px 12px; border-radius: var(--radius-sm); border: none; font-size: 12px; font-weight: 600; cursor: pointer; }
  .btn:active { opacity: 0.75; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-ghost { background: var(--surface2); color: var(--text); }
  .btn-danger { background: rgba(255,107,107,0.15); color: var(--red); }
  .btn-sm { padding: 4px 8px; font-size: 11px; }
  .dday-card { background: linear-gradient(135deg, #1e2a5e 0%, #2d1f5e 100%); border: 1px solid #3d4a8a; border-radius: var(--radius); padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .dday-left { display: flex; flex-direction: column; gap: 4px; }
  .dday-main { display: flex; align-items: baseline; gap: 8px; }
  .dday-num { font-size: 32px; font-weight: 800; color: var(--accent); line-height: 1; }
  .dday-target-date { font-size: 13px; font-weight: 600; color: #a5b4fc; }
  .dday-right { text-align: right; }
  
  .breadcrumb { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .bc-item { font-size: 12px; color: var(--text2); cursor: pointer; padding: 3px 6px; border-radius: 4px; background: var(--surface2); }
  .bc-sep { font-size: 10px; color: var(--text3); }
  .bc-current { font-size: 12px; color: var(--text); font-weight: 600; }
  .list-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; }
  .action-btns { display: flex; gap: 4px; }
  .prob-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 8px; }
  .prob-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .prob-num { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .history-list { font-size: 11px; color: var(--text2); border-top: 1px dashed var(--border); padding-top: 6px; margin-top: 6px; }
  .history-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; padding: 2px 0; }
  .sub-tab-bar { display: flex; gap: 6px; margin-bottom: 12px; }
  .sub-tab-btn { flex: 1; padding: 8px; font-size: 11px; font-weight: bold; text-align: center; background: var(--surface2); color: var(--text2); border-radius: var(--radius-sm); border: 1px solid var(--border); cursor: pointer; }
  .sub-tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: var(--surface); padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
  
  .monthly-container { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 4px; }
  .cal-grid-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-bottom: 6px; }
  .cal-day-head { font-size: 11px; font-weight: bold; color: var(--text2); padding: 4px 0; }
  .month-week-row { display: grid; grid-template-columns: repeat(7, 1fr); position: relative; border-top: 1px solid var(--border); min-height: 72px; }
  .month-cell { position: relative; min-height: 72px; padding: 4px; cursor: pointer; transition: background 0.15s; }
  .month-cell:hover { background: rgba(255, 255, 255, 0.03); }
  .month-cell.today .date-num { color: var(--accent); font-weight: 800; }
  .month-cell.other-month { opacity: 0.25; }
  .date-num { font-size: 10px; font-weight: 700; text-align: center; margin-bottom: 4px; pointer-events: none; }
  
  .gantt-bars-container { position: absolute; top: 22px; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 2px; pointer-events: none; }
  .gantt-bar-slot { height: 14px; position: relative; width: 100%; }
  .gantt-bar { position: absolute; height: 14px; line-height: 14px; font-size: 8px; font-weight: 600; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 10; box-sizing: border-box; }
  .gantt-start { border-top-left-radius: 3px; border-bottom-left-radius: 3px; }
  .gantt-end { border-top-right-radius: 3px; border-bottom-right-radius: 3px; }
  
  .gantt-경영학 { background: var(--color-경영학-bg); border: 1px solid var(--color-경영학-border); color: var(--color-경영학-text); }
  .gantt-경제학 { background: var(--color-경제학-bg); border: 1px solid var(--color-경제학-border); color: var(--color-경제학-text); }
  .gantt-상법   { background: var(--color-상법-bg); border: 1px solid var(--color-상법-border); color: var(--color-상법-text); }
  .gantt-세법   { background: var(--color-세법-bg); border: 1px solid var(--color-세법-border); color: var(--color-세법-text); }
  .gantt-회계학 { background: var(--color-회계학-bg); border: 1px solid var(--color-회계학-border); color: var(--color-회계학-text); }

  .weekly-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; margin-bottom: 8px; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 200; align-items: flex-end; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 16px 16px 0 0; padding: 20px; width: 100%; max-height: 85vh; overflow-y: auto; }
  .form-group { margin-bottom: 12px; }
  .form-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; display: block; }
  .form-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; color: var(--text); outline: none; }
  .days-checkboxes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .day-chk { display: none; }
  .day-lbl { padding: 6px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; font-size: 11px; cursor: pointer; }
  .day-chk:checked + .day-lbl { background: var(--accent); color: white; border-color: var(--accent); }
  
  .badge-pending { background: rgba(255, 255, 255, 0.1); color: #bbb; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
  .badge-rollover { background: rgba(249, 115, 22, 0.2); color: #f97316; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
  .badge-done { background: rgba(62, 207, 142, 0.15); color: var(--green); padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }

  .bulk-bar { display: flex; gap: 8px; align-items: center; justify-content: space-between; background: var(--surface2); padding: 8px 12px; border-radius: var(--radius-sm); margin-bottom: 12px; border: 1px solid var(--border); }
  .chk-custom { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }

  /* 다중 필터바 스타일 */
  .filter-bar { display: flex; gap: 6px; margin-bottom: 12px; background: var(--surface2); padding: 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); align-items: center; flex-wrap: wrap; }
  .filter-btn { flex: 1; min-width: 90px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 11px; padding: 6px 8px; text-align: center; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .filter-btn.active { border-color: var(--accent); color: var(--accent); font-weight: bold; }
  .checkbox-group { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; background: var(--surface2); padding: 8px 10px; border-radius: 6px; }

  /* 총괄 진도표 전용 CSS */
  .matrix-wrapper { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; margin-top: 8px; }
  .matrix-table { width: 100%; border-collapse: collapse; min-width: 520px; font-size: 11px; }
  .matrix-table th, .matrix-table td { border: 1px solid var(--border); padding: 6px 4px; text-align: center; vertical-align: middle; }
  .matrix-table th { background: var(--surface2); color: var(--text2); font-weight: 600; white-space: nowrap; }
  .matrix-table td.sub-name { background: var(--surface2); font-weight: 700; color: var(--text); white-space: nowrap; position: sticky; left: 0; z-index: 5; text-align: left; padding-left: 8px; }
  .matrix-select { background: transparent; color: var(--text); border: none; font-size: 11px; font-weight: 600; cursor: pointer; text-align-last: center; outline: none; width: 100%; }
  
  /* 진도 시각화 배지 스타일 */
  .badge-matrix { display: inline-block; padding: 2px 5px; border-radius: 4px; font-size: 10px; font-weight: bold; width: 100%; text-align: center; }
  .status-none { background: rgba(255,255,255,0.05); color: var(--text3); }
  .status-done { background: rgba(62, 207, 142, 0.2); color: var(--green); border: 1px solid var(--green); }
  .status-1r   { background: rgba(91, 127, 255, 0.2); color: var(--accent); border: 1px solid var(--accent); }
  .status-2r   { background: rgba(14, 165, 233, 0.2); color: #7dd3fc; border: 1px solid #0ea5e9; }
  .status-3r   { background: rgba(234, 179, 8, 0.2); color: #fef08a; border: 1px solid #eab308; }
  .status-4r   { background: rgba(249, 115, 22, 0.2); color: #fdba74; border: 1px solid #f97316; }
  .status-5r   { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
</style>
</head>
<body>

<div class="top-bar">
  <div>
    <h1>📚 CPA Tracker Pro</h1>
    <div class="sub">2027년 동차 합격 목표</div>
  </div>
  <div>
    <button class="btn btn-sm btn-ghost" onclick="resetToDefault()">🔄 초기화</button>
    <button class="btn btn-sm btn-ghost" onclick="exportData()">💾 백업</button>
    <button class="btn btn-sm btn-ghost" onclick="importData()">📂 복구</button>
  </div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="showPage('dashboard')">대시보드</button>
  <button class="tab-btn" onclick="showPage('study')">공부기록</button>
  <button class="tab-btn" onclick="showPage('scheduler')">스케줄러</button>
  <button class="tab-btn" onclick="showPage('calendar')">캘린더</button>
</div>

<!-- 대시보드 -->
<div id="page-dashboard" class="page active">
  <div class="dday-card">
    <div class="dday-left">
      <div class="dday-main">
        <div class="dday-num" id="ddayNum">D-—</div>
        <div class="dday-target-date" style="font-size:12px; color:var(--text2);">2027-02-28</div>
      </div>
    </div>
    <div class="dday-right">
      <div style="font-size:12px;color:var(--text2);" id="todayDate"></div>
      <div style="font-size:14px;font-weight:700;">CPA 1차 시험</div>
    </div>
  </div>
  
  <div class="section-title">📊 과목별 총괄 진도표</div>
  <div class="matrix-wrapper">
    <table class="matrix-table">
      <thead>
        <tr>
          <th style="min-width: 100px;">하위 과목</th>
          <th>(연)인강</th>
          <th>(연)문풀</th>
          <th>(객)문풀</th>
          <th>(객)기출</th>
          <th>(객)모고</th>
          <th>기타</th>
        </tr>
      </thead>
      <tbody id="matrixTableBody"></tbody>
    </table>
  </div>
</div>

<!-- 공부기록 트래커 -->
<div id="page-study" class="page">
  <div class="breadcrumb" id="breadcrumb"></div>

  <!-- 다중 중복 선택 필터 바 -->
  <div class="filter-bar">
    <button class="filter-btn" id="filterRoundBtn" onclick="openFilterModal('round')">회독 중복 선택</button>
    <button class="filter-btn" id="filterStatusBtn" onclick="openFilterModal('status')">기호 중복 선택</button>
    <button class="btn btn-sm btn-ghost" onclick="resetFilters()">🔄 초기화</button>
  </div>

  <div id="studyList"></div>
</div>

<!-- 스케줄러 -->
<div id="page-scheduler" class="page">
  <div class="card">
    <div style="font-weight:700;margin-bottom:12px;">📅 공부 목표 및 기간 배분기</div>
    <div class="form-group">
      <label class="form-label">1. 대과목 선택</label>
      <select class="form-input" id="schSubj" onchange="updateSubSelect()"></select>
    </div>
    <div class="form-group">
      <label class="form-label">2. 하위 과목 선택</label>
      <select class="form-input" id="schSub" onchange="updateTaskSelect()"></select>
    </div>
    <div class="form-group">
      <label class="form-label">3. 교재 / 강좌 선택</label>
      <select class="form-input" id="schTask" onchange="updateChSelect()"></select>
    </div>
    <div class="form-group">
      <label class="form-label">4. 챕터 선택</label>
      <select class="form-input" id="schCh"></select>
    </div>

    <div class="form-group">
      <label class="form-label">배분할 총 문제 수 (예: 50)</label>
      <input type="number" class="form-input" id="schTotal" placeholder="예: 50">
    </div>
    <div class="form-group">
      <label class="form-label">시작일 ~ 종료일</label>
      <div style="display:flex;gap:6px;">
        <input type="date" class="form-input" id="schStart">
        <input type="date" class="form-input" id="schEnd">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">공부 요일 지정</label>
      <div class="days-checkboxes">
        <input type="checkbox" id="d1" class="day-chk" value="1" checked><label for="d1" class="day-lbl">월</label>
        <input type="checkbox" id="d2" class="day-chk" value="2" checked><label for="d2" class="day-lbl">화</label>
        <input type="checkbox" id="d3" class="day-chk" value="3" checked><label for="d3" class="day-lbl">수</label>
        <input type="checkbox" id="d4" class="day-chk" value="4" checked><label for="d4" class="day-lbl">목</label>
        <input type="checkbox" id="d5" class="day-chk" value="5" checked><label for="d5" class="day-lbl">금</label>
        <input type="checkbox" id="d6" class="day-chk" value="6"><label for="d6" class="day-lbl">토</label>
        <input type="checkbox" id="d0" class="day-chk" value="0"><label for="d0" class="day-lbl">일</label>
      </div>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="generateSchedule()">배분 실행 & 공부기록 자동 연동</button>
  </div>
</div>

<!-- 캘린더 -->
<div id="page-calendar" class="page">
  <div class="sub-tab-bar">
    <div class="sub-tab-btn active" id="calTabDaily" onclick="setCalView('daily')">Daily</div>
    <div class="sub-tab-btn" id="calTabWeekly" onclick="setCalView('weekly')">Weekly</div>
    <div class="sub-tab-btn" id="calTabMonthly" onclick="setCalView('monthly')">Monthly</div>
  </div>
  <div id="calList"></div>
</div>

<!-- 다중 선택 필터 모달 -->
<div class="modal-overlay" id="filterModal">
  <div class="modal">
    <div style="font-weight:700;margin-bottom:12px;" id="filterModalTitle">필터 선택</div>
    <div class="checkbox-group" id="filterCheckboxList"></div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn-ghost" style="flex:1" onclick="closeModal('filterModal')">취소</button>
      <button class="btn btn-primary" style="flex:1" onclick="applyMultiFilter()">필터 적용하기</button>
    </div>
  </div>
</div>

<!-- 개별 풀이 기록 모달 -->
<div class="modal-overlay" id="probModal">
  <div class="modal">
    <div style="font-weight:700;margin-bottom:12px;" id="probModalTitle">문제 기록 수정</div>
    <div class="form-group">
      <label class="form-label">회독 선택</label>
      <select class="form-input" id="probRound">
        <option value="1">1회독</option>
        <option value="2">2회독</option>
        <option value="3">3회독</option>
        <option value="4">4회독</option>
        <option value="5">5회독</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">상태 변경</label>
      <select class="form-input" id="probStatus">
        <option value="O">O (맞음)</option>
        <option value="△">△ (실수) - 14일 후 복습</option>
        <option value="☆">☆ (오답) - 2일 후 복습</option>
        <option value="♥">♥ (다시풀기) - 7일 후 복습</option>
        <option value="미진행">미진행</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">풀이/예정 날짜</label>
      <input type="date" class="form-input" id="probDate">
    </div>
    <div class="form-group">
      <label class="form-label">메모</label>
      <input type="text" class="form-input" id="probMemo" placeholder="오답 이유 등">
    </div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn-ghost" style="flex:1" onclick="closeModal('probModal')">취소</button>
      <button class="btn btn-primary" style="flex:1" onclick="saveProbRecord()">저장하기</button>
    </div>
  </div>
</div>

<!-- 일괄 날짜 변경 모달 -->
<div class="modal-overlay" id="bulkDateModal">
  <div class="modal">
    <div style="font-weight:700;margin-bottom:12px;">🗓️ 선택한 문제 날짜 일괄 변경</div>
    <div class="form-group">
      <label class="form-label">변경할 지정 날짜</label>
      <input type="date" class="form-input" id="bulkTargetDate">
    </div>
    <div style="font-size:11px;color:var(--text2);margin-bottom:12px;">
      * 체크 박스로 선택하신 모든 문제의 기록 날짜가 이 날짜로 일괄 변경됩니다.
    </div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn-ghost" style="flex:1" onclick="closeModal('bulkDateModal')">취소</button>
      <button class="btn btn-primary" style="flex:1" onclick="executeSelectedBulkDateChange()">날짜 일괄 변경 실행</button>
    </div>
  </div>
</div>

<script>
const DEFAULT_STRUCTURE = {
  "경영학": { "일반경영": { "객관식 기출": ["기본"] }, "재무관리": { "연습서 문풀": ["기본"] } },
  "경제학": { "미시경제": { "객관식 기출": ["기본"] } },
  "상법": { "회사법": { "객관식 기출": ["기본"] } },
  "세법": { "법인세법": { "(객)강경태": ["CH.1 총설"] } },
  "회계학": { "중급회계": { "연습서 문풀": ["기본"] } }
};

/* 새로 지정된 총괄 진도표 목록 및 옵션 설정 */
const MATRIX_SUB_LIST = [
  "일반경영", "재무관리", "미시경제", "거시경제", 
  "회사법", "외감&공회법", "법인세법", "소득세법", 
  "부가가치세법", "국기법", "상증&기타세법", 
  "중급회계", "고급회계", "정부회계", "원가관리회계"
];
const MATRIX_COLS = ["(연)인강", "(연)문풀", "(객)문풀", "(객)기출", "(객)모고", "기타"];
const MATRIX_OPTIONS = ["-", "미진행", "완료", "1회독", "2회독", "3회독", "4회독", "5회독"];

function getProgressMatrix() {
  return JSON.parse(localStorage.getItem('cpaProgressMatrix') || '{}');
}
function saveProgressMatrix(data) {
  localStorage.setItem('cpaProgressMatrix', JSON.stringify(data));
}

/* 다중 선택 필터 데이터 구조 */
let selectedFilterRounds = [];
let selectedFilterStatuses = [];
let currentFilterTarget = null; // 'round' or 'status'

function getStructure() {
  const data = localStorage.getItem('cpaStructure');
  return data ? JSON.parse(data) : DEFAULT_STRUCTURE;
}
function saveStructure(struct) { localStorage.setItem('cpaStructure', JSON.stringify(struct)); }
function getData() { return JSON.parse(localStorage.getItem('cpaRecords') || '{}'); }
function saveData(data) { localStorage.setItem('cpaRecords', JSON.stringify(data)); }
function getSchedules() { return JSON.parse(localStorage.getItem('cpaSchedules') || '[]'); }
function saveSchedules(schs) { localStorage.setItem('cpaSchedules', JSON.stringify(schs)); }

function resetToDefault() {
  if (confirm('초기화하시겠습니까? 데이터가 전부 삭제됩니다.')) {
    localStorage.clear();
    location.reload();
  }
}

function updateRecordKeys(oldPrefix, newPrefix) {
  const records = getData();
  const updatedRecords = {};

  Object.keys(records).forEach(key => {
    if (key.startsWith(oldPrefix + '|')) {
      const newKey = key.replace(oldPrefix + '|', newPrefix + '|');
      updatedRecords[newKey] = records[key];
    } else {
      updatedRecords[key] = records[key];
    }
  });

  saveData(updatedRecords);
}

let studyPath = [];
let calViewMode = 'daily';
let currentCalDate = new Date();

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  if (id === 'dashboard') renderDashboard();
  if (id === 'study') renderStudy();
  if (id === 'scheduler') initSchedulerSelects();
  if (id === 'calendar') renderCalendar();
}

function getStatusClass(val) {
  if (val === '완료') return 'status-done';
  if (val === '1회독') return 'status-1r';
  if (val === '2회독') return 'status-2r';
  if (val === '3회독') return 'status-3r';
  if (val === '4회독') return 'status-4r';
  if (val === '5회독') return 'status-5r';
  return 'status-none';
}

function renderDashboard() {
  const exam = new Date('2027-02-28');
  const diff = Math.ceil((exam - new Date()) / 86400000);
  document.getElementById('ddayNum').textContent = diff >= 0 ? `D-${diff}` : `D+${Math.abs(diff)}`;
  document.getElementById('todayDate').textContent = new Date().toISOString().split('T')[0];

  /* 총괄 진도표 매트릭스 랜더링 */
  const matrixData = getProgressMatrix();
  const tbody = document.getElementById('matrixTableBody');
  tbody.innerHTML = '';

  MATRIX_SUB_LIST.forEach(sub => {
    let rowHtml = `<tr><td class="sub-name">${sub}</td>`;
    MATRIX_COLS.forEach(col => {
      const key = `${sub}|${col}`;
      // 기존 (해당없음) 데이터 호환 처리
      let val = matrixData[key] || '-';
      if (val === '(해당없음)') val = '-';

      const statusClass = getStatusClass(val);

      let optionsHtml = MATRIX_OPTIONS.map(opt => `
        <option value="${opt}" ${opt === val ? 'selected' : ''}>${opt}</option>
      `).join('');

      rowHtml += `
        <td>
          <div class="badge-matrix ${statusClass}">
            <select class="matrix-select" onchange="updateMatrixStatus('${sub}', '${col}', this.value)">
              ${optionsHtml}
            </select>
          </div>
        </td>
      `;
    });
    rowHtml += `</tr>`;
    tbody.innerHTML += rowHtml;
  });
}

function updateMatrixStatus(sub, col, value) {
  const matrixData = getProgressMatrix();
  matrixData[`${sub}|${col}`] = value;
  saveProgressMatrix(matrixData);
  renderDashboard();
}

function initSchedulerSelects() {
  const struct = getStructure();
  const subjSelect = document.getElementById('schSubj');
  subjSelect.innerHTML = '';
  
  Object.keys(struct).forEach(s => {
    subjSelect.innerHTML += `<option value="${s}">${s}</option>`;
  });
  updateSubSelect();
}

function updateSubSelect() {
  const struct = getStructure();
  const subj = document.getElementById('schSubj').value;
  const subSelect = document.getElementById('schSub');
  subSelect.innerHTML = '';

  if (struct[subj]) {
    Object.keys(struct[subj]).forEach(s => {
      subSelect.innerHTML += `<option value="${s}">${s}</option>`;
    });
  }
  updateTaskSelect();
}

function updateTaskSelect() {
  const struct = getStructure();
  const subj = document.getElementById('schSubj').value;
  const sub = document.getElementById('schSub').value;
  const taskSelect = document.getElementById('schTask');
  taskSelect.innerHTML = '';

  if (struct[subj] && struct[subj][sub]) {
    Object.keys(struct[subj][sub]).forEach(t => {
      taskSelect.innerHTML += `<option value="${t}">${t}</option>`;
    });
  }
  updateChSelect();
}

function updateChSelect() {
  const struct = getStructure();
  const subj = document.getElementById('schSubj').value;
  const sub = document.getElementById('schSub').value;
  const task = document.getElementById('schTask').value;
  const chSelect = document.getElementById('schCh');
  chSelect.innerHTML = '';

  if (struct[subj] && struct[subj][sub] && struct[subj][sub][task]) {
    struct[subj][sub][task].forEach(ch => {
      chSelect.innerHTML += `<option value="${ch}">${ch}</option>`;
    });
  }
}

function generateSchedule() {
  const subj = document.getElementById('schSubj').value;
  const sub = document.getElementById('schSub').value;
  const task = document.getElementById('schTask').value;
  const ch = document.getElementById('schCh').value;
  const total = Number(document.getElementById('schTotal').value);
  const startStr = document.getElementById('schStart').value;
  const endStr = document.getElementById('schEnd').value;
  const selectedDays = Array.from(document.querySelectorAll('.day-chk:checked')).map(cb => Number(cb.value));

  if (!subj || !sub || !task || !ch || !total || !startStr || !endStr || selectedDays.length === 0) {
    alert('모든 단계를 정확히 선택/입력해 주세요.');
    return;
  }

  const start = new Date(startStr);
  const end = new Date(endStr);
  let dates = [];
  let curr = new Date(start);
  while (curr <= end) {
    if (selectedDays.includes(curr.getDay())) dates.push(new Date(curr));
    curr.setDate(curr.getDate() + 1);
  }

  if (dates.length === 0) {
    alert('선택한 기간 내에 지정한 공부 요일이 없습니다.');
    return;
  }

  const schedules = getSchedules();
  schedules.push({ subj, title: `${task} (${ch})`, start: startStr, end: endStr });
  saveSchedules(schedules);

  const records = getData();
  const perDay = Math.ceil(total / dates.length);
  let currentNum = 1;

  dates.forEach(d => {
    if (currentNum > total) return;
    const endNum = Math.min(currentNum + perDay - 1, total);
    const dateFormatted = d.toISOString().split('T')[0];

    for (let i = currentNum; i <= endNum; i++) {
      const pKey = `${subj}|${sub}|${task}|${ch}|${i}`;
      if (!records[pKey]) records[pKey] = { history: [] };
      records[pKey].history.push({
        round: '1',
        status: '미진행',
        date: dateFormatted,
        scheduledDate: dateFormatted,
        memo: '스케줄 자동 배분'
      });
    }
    currentNum = endNum + 1;
  });

  saveData(records);
  alert('선택한 공부기록 위치로 문제 생성이 완료되었습니다.');
  showPage('calendar');
}

/* 필터 UI 업데이트 및 모달 제어 */
function openFilterModal(target) {
  currentFilterTarget = target;
  const list = document.getElementById('filterCheckboxList');
  const title = document.getElementById('filterModalTitle');
  list.innerHTML = '';

  if (target === 'round') {
    title.textContent = '회독 선택 (중복 가능)';
    ['1', '2', '3', '4', '5'].forEach(r => {
      const isChecked = selectedFilterRounds.includes(r) ? 'checked' : '';
      list.innerHTML += `
        <label class="checkbox-item">
          <input type="checkbox" class="chk-custom filter-chk" value="${r}" ${isChecked}>
          ${r}회독
        </label>
      `;
    });
  } else {
    title.textContent = '기호 선택 (중복 가능)';
    [
      { val: 'O', label: 'O (맞음)' },
      { val: '△', label: '△ (실수)' },
      { val: '☆', label: '☆ (오답)' },
      { val: '♥', label: '♥ (다시풀기)' },
      { val: '미진행', label: '미진행' }
    ].forEach(item => {
      const isChecked = selectedFilterStatuses.includes(item.val) ? 'checked' : '';
      list.innerHTML += `
        <label class="checkbox-item">
          <input type="checkbox" class="chk-custom filter-chk" value="${item.val}" ${isChecked}>
          ${item.label}
        </label>
      `;
    });
  }
  document.getElementById('filterModal').classList.add('open');
}

function applyMultiFilter() {
  const chks = document.querySelectorAll('.filter-chk:checked');
  const values = Array.from(chks).map(c => c.value);

  if (currentFilterTarget === 'round') {
    selectedFilterRounds = values;
  } else {
    selectedFilterStatuses = values;
  }

  closeModal('filterModal');
  updateFilterBarUI();
  renderStudy();
}

function resetFilters() {
  selectedFilterRounds = [];
  selectedFilterStatuses = [];
  updateFilterBarUI();
  renderStudy();
}

function updateFilterBarUI() {
  const roundBtn = document.getElementById('filterRoundBtn');
  const statusBtn = document.getElementById('filterStatusBtn');

  if (selectedFilterRounds.length > 0) {
    roundBtn.classList.add('active');
    roundBtn.textContent = `회독: ${selectedFilterRounds.join(', ')}회`;
  } else {
    roundBtn.classList.remove('active');
    roundBtn.textContent = '회독 중복 선택';
  }

  if (selectedFilterStatuses.length > 0) {
    statusBtn.classList.add('active');
    statusBtn.textContent = `기호: ${selectedFilterStatuses.join(', ')}`;
  } else {
    statusBtn.classList.remove('active');
    statusBtn.textContent = '기호 중복 선택';
  }
}

function renderStudy() {
  const struct = getStructure();
  const bc = document.getElementById('breadcrumb');
  const list = document.getElementById('studyList');

  const isFiltering = (selectedFilterRounds.length > 0 || selectedFilterStatuses.length > 0);

  let bcHtml = '<span class="bc-item" onclick="navTo([])">전체 과목</span>';
  studyPath.forEach((p, i) => {
    bcHtml += ' <span class="bc-sep">›</span> ';
    bcHtml += i < studyPath.length - 1 
      ? `<span class="bc-item" onclick="navTo(studyPath.slice(0,${i+1}))">${p}</span>`
      : `<span class="bc-current">${p}</span>`;
  });
  bc.innerHTML = bcHtml;
  list.innerHTML = '';

  if (isFiltering) {
    renderFilteredProblems();
    return;
  }

  const depth = studyPath.length;

  if (depth === 0) {
    list.innerHTML += `<button class="btn btn-ghost" style="width:100%;margin-bottom:8px" onclick="addMainSubject()">+ 대과목 추가</button>`;
    Object.keys(struct).forEach((subj, idx) => {
      list.innerHTML += `<div class="list-item">
        <div onclick="navTo(['${subj}'])" style="flex:1;cursor:pointer"><strong>${subj}</strong></div>
        <div class="action-btns">
          <button class="btn btn-sm btn-ghost" onclick="moveItem(0, [], ${idx}, -1)">▲</button>
          <button class="btn btn-sm btn-ghost" onclick="moveItem(0, [], ${idx}, 1)">▼</button>
          <button class="btn btn-sm btn-ghost" onclick="editMainSubject('${subj}')">수정</button>
          <button class="btn btn-sm btn-danger" onclick="deleteMainSubject('${subj}')">삭제</button>
        </div>
      </div>`;
    });
  } 
  else if (depth === 1) {
    const subj = studyPath[0];
    list.innerHTML += `<button class="btn btn-ghost" style="width:100%;margin-bottom:8px" onclick="addSubSubject('${subj}')">+ 하위 과목 추가</button>`;
    Object.keys(struct[subj] || {}).forEach((sub, idx) => {
      list.innerHTML += `<div class="list-item">
        <div onclick="navTo(['${subj}','${sub}'])" style="flex:1;cursor:pointer"><strong>${sub}</strong></div>
        <div class="action-btns">
          <button class="btn btn-sm btn-ghost" onclick="moveItem(1, ['${subj}'], ${idx}, -1)">▲</button>
          <button class="btn btn-sm btn-ghost" onclick="moveItem(1, ['${subj}'], ${idx}, 1)">▼</button>
          <button class="btn btn-sm btn-ghost" onclick="editSubSubject('${subj}','${sub}')">수정</button>
          <button class="btn btn-sm btn-danger" onclick="deleteSubSubject('${subj}','${sub}')">삭제</button>
        </div>
      </div>`;
    });
  } 
  else if (depth === 2) {
    const [subj, sub] = studyPath;
    list.innerHTML += `<button class="btn btn-ghost" style="width:100%;margin-bottom:8px" onclick="addTask('${subj}','${sub}')">+ 문제집/강좌 추가</button>`;
    Object.keys(struct[subj][sub] || {}).forEach((task, idx) => {
      list.innerHTML += `<div class="list-item">
        <div onclick="navTo(['${subj}','${sub}','${task}'])" style="flex:1;cursor:pointer"><strong>${task}</strong></div>
        <div class="action-btns">
          <button class="btn btn-sm btn-ghost" onclick="moveItem(2, ['${subj}','${sub}'], ${idx}, -1)">▲</button>
          <button class="btn btn-sm btn-ghost" onclick="moveItem(2, ['${subj}','${sub}'], ${idx}, 1)">▼</button>
          <button class="btn btn-sm btn-ghost" onclick="editTask('${subj}','${sub}','${task}')">수정</button>
          <button class="btn btn-sm btn-danger" onclick="deleteTask('${subj}','${sub}','${task}')">삭제</button>
        </div>
      </div>`;
    });
  }
  else if (depth === 3) {
    const [subj, sub, task] = studyPath;
    list.innerHTML += `<button class="btn btn-ghost" style="width:100%;margin-bottom:8px" onclick="addChapter('${subj}','${sub}','${task}')">+ 챕터 추가</button>`;
    (struct[subj][sub][task] || []).forEach((ch, idx) => {
      list.innerHTML += `<div class="list-item">
        <div onclick="navTo(['${subj}','${sub}','${task}','${ch}'])" style="flex:1;cursor:pointer"><strong>${ch}</strong></div>
        <div class="action-btns">
          <button class="btn btn-sm btn-ghost" onclick="moveItem(3, ['${subj}','${sub}','${task}'], ${idx}, -1)">▲</button>
          <button class="btn btn-sm btn-ghost" onclick="moveItem(3, ['${subj}','${sub}','${task}'], ${idx}, 1)">▼</button>
          <button class="btn btn-sm btn-ghost" onclick="editChapter('${subj}','${sub}','${task}','${ch}')">수정</button>
          <button class="btn btn-sm btn-danger" onclick="deleteChapter('${subj}','${sub}','${task}','${ch}')">삭제</button>
        </div>
      </div>`;
    });
  }
  else if (depth === 4) {
    const [subj, sub, task, ch] = studyPath;
    const pathKey = `${subj}|${sub}|${task}|${ch}`;
    
    const records = getData();
    const probs = Object.keys(records).filter(k => k.startsWith(pathKey + '|'));

    let html = `
      <button class="btn btn-ghost" style="width:100%;margin-bottom:12px" onclick="addProblem('${pathKey}')">+ 문제 수동 추가</button>
    `;

    if (probs.length > 0) {
      html += `
        <div class="bulk-bar">
          <label style="font-size:12px; font-weight:bold; cursor:pointer; display:flex; align-items:center; gap:6px;">
            <input type="checkbox" class="chk-custom" id="selectAllProb" onchange="toggleSelectAllProbs(this)">
            전체 선택
          </label>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-sm btn-ghost" onclick="openSelectedBulkDateModal()">📅 선택 날짜 일괄 변경</button>
            <button class="btn btn-sm btn-danger" onclick="deleteSelectedProblems()">🗑️ 선택 일괄 삭제</button>
          </div>
        </div>
      `;
    }

    probs.forEach(pKey => {
      const probNum = pKey.split('|')[4];
      const history = records[pKey].history || [];

      let historyHtml = history.map((h, idx) => {
        return `<div class="history-item">
          <div>
            <strong>${h.round}회독 [${h.status}]</strong> - ${h.date} 
            ${h.memo ? `<span style="color:var(--text3)">| ${h.memo}</span>` : ''}
          </div>
          <div>
            <button class="btn btn-sm btn-ghost" onclick="openProbModal('${pKey}', ${idx})">수정</button>
            <button class="btn btn-sm btn-danger" onclick="deleteProbRecord('${pKey}', ${idx})">삭제</button>
          </div>
        </div>`;
      }).join('');

      html += `<div class="prob-card">
        <div class="prob-header">
          <div class="prob-num">
            <input type="checkbox" class="chk-custom prob-chk" value="${pKey}">
            ${probNum}번 문제
          </div>
          <div>
            <button class="btn btn-sm btn-danger" style="margin-right:4px;" onclick="deleteProblem('${pKey}')">삭제</button>
            <button class="btn btn-sm btn-primary" onclick="openProbModal('${pKey}')">+ 회독 기록</button>
          </div>
        </div>
        <div class="history-list">${historyHtml || '기록 없음'}</div>
      </div>`;
    });

    list.innerHTML = html;
  }
}

/* 중복 선택 필터 적용 실행 함수 */
function renderFilteredProblems() {
  const list = document.getElementById('studyList');
  const records = getData();
  const currentPathPrefix = studyPath.join('|');

  let filteredCards = [];

  Object.keys(records).forEach(pKey => {
    if (currentPathPrefix && !pKey.startsWith(currentPathPrefix)) return;

    const parts = pKey.split('|');
    if (parts.length < 5) return;
    const [subj, sub, task, ch, num] = parts;
    const history = records[pKey].history || [];

    const matchedHistory = history.filter(h => {
      const matchRound = (selectedFilterRounds.length === 0 || selectedFilterRounds.includes(String(h.round)));
      const matchStatus = (selectedFilterStatuses.length === 0 || selectedFilterStatuses.includes(h.status));
      return matchRound && matchStatus;
    });

    if (matchedHistory.length > 0) {
      filteredCards.push({
        pKey,
        pathStr: `${subj} > ${sub} > ${task} > ${ch}`,
        num,
        history: matchedHistory
      });
    }
  });

  if (filteredCards.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text2);">선택하신 중복 조건에 일치하는 문제가 없습니다.</div>';
    return;
  }

  let html = `<div style="font-size:11px;color:var(--text2);margin-bottom:8px;">🔍 중복 필터 검색 결과: ${filteredCards.length}개 문제</div>`;

  filteredCards.forEach(item => {
    let historyHtml = item.history.map((h) => {
      return `<div class="history-item">
        <div>
          <strong>${h.round}회독 [${h.status}]</strong> - ${h.date} 
          ${h.memo ? `<span style="color:var(--text3)">| ${h.memo}</span>` : ''}
        </div>
      </div>`;
    }).join('');

    html += `<div class="prob-card">
      <div class="prob-header">
        <div class="prob-num">${item.num}번 문제</div>
        <button class="btn btn-sm btn-primary" onclick="openProbModal('${item.pKey}')">+ 회독 추가</button>
      </div>
      <div style="font-size:11px;color:var(--accent);margin-bottom:6px;">${item.pathStr}</div>
      <div class="history-list">${historyHtml}</div>
    </div>`;
  });

  list.innerHTML = html;
}

function navTo(path) { studyPath = path; renderStudy(); }

function toggleSelectAllProbs(master) {
  const chks = document.querySelectorAll('.prob-chk');
  chks.forEach(c => c.checked = master.checked);
}

function getSelectedProbKeys() {
  const chks = document.querySelectorAll('.prob-chk:checked');
  return Array.from(chks).map(c => c.value);
}

function deleteSelectedProblems() {
  const selectedKeys = getSelectedProbKeys();

    alert('삭제할 문제를 체크박스로 하나 이상 선택해 주세요.');

  }

  if (!confirm(`선택한 ${selectedKeys.length}개 문제 기록을 삭제하시겠습니까?`)) return;

    delete records[k];
  });

  saveData(records);
  alert(`${selectedKeys.length}개 문제가 성공적으로 삭제되었습니다.`);

function openSelectedBulkDateModal() {
  const selectedKeys = getSelectedProbKeys();
  if (selectedKeys.length === 0) {
    alert('날짜를 변경할 문제를 체크박스로 하나 이상 선택해 주세요.');

  }
  document.getElementById('bulkTargetDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('bulkDateModal').classList.add('open');

function executeSelectedBulkDateChange() {
  const targetDate = document.getElementById('bulkTargetDate').value;
  if (!targetDate) {
    alert('날짜를 지정해 주세요.');
    return;
  }

  const selectedKeys = getSelectedProbKeys();
  const records = getData();
  let updatedCount = 0;

  selectedKeys.forEach(k => {
    if (records[k] && records[k].history) {
      records[k].history.forEach(h => {
        h.date = targetDate;
        h.scheduledDate = targetDate;
        updatedCount++;
      });
    }
  });

  saveData(records);
  alert(`선택된 문제들의 ${updatedCount}개 회독/예정 날짜가 [${targetDate}] 로 일괄 변경되었습니다.`);

function setCalView(mode) {
  calViewMode = mode;
  document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('calTab' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
  renderCalendar();
}

function navigateCal(offset) {
  if (calViewMode === 'daily') currentCalDate.setDate(currentCalDate.getDate() + offset);
  else if (calViewMode === 'weekly') currentCalDate.setDate(currentCalDate.getDate() + (offset * 7));
  else if (calViewMode === 'monthly') currentCalDate.setMonth(currentCalDate.getMonth() + offset);
  renderCalendar();
}

function resetCalToToday() {
  currentCalDate = new Date();
  renderCalendar();
}

function goToDailyView(dateStr) {
  const parts = dateStr.split('-');
  currentCalDate = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  setCalView('daily');
}

function getDailyEvents(targetDateStr) {
  const records = getData();
  const todayStr = new Date().toISOString().split('T')[0];
  const events = [];

  Object.keys(records).forEach(pKey => {
    const parts = pKey.split('|');
    if (parts.length >= 5) {
      const [subj, sub, task, ch, num] = parts;
      const history = records[pKey].history || [];

      history.forEach(h => {
        const isPast = h.scheduledDate < todayStr;
        const isUnfinished = h.status === '미진행';

        if (h.date === targetDateStr) {
          if (isUnfinished && isPast && targetDateStr < todayStr) {
            events.push({
              type: 'rollover-past',
              text: `➡️ [이월됨] ${subj} > ${task} : ${num}번 문제 (${h.status})`
            });
          } else {
            events.push({
              type: isUnfinished ? 'pending' : 'done',
              text: `[${subj} > ${task} > ${ch}] ${num}번 문제 (${h.status})`
            });
          }
        }
        else if (targetDateStr === todayStr && isPast && isUnfinished) {
          events.push({
            type: 'rollover-today',
            text: `↪️ [이월 할일] ${subj} > ${task} : ${num}번 문제 (원래:${h.scheduledDate})`
          });
        }
      });
    }
  });

  return events;
}

function renderCalendar() {
  const list = document.getElementById('calList');
  const todayStr = new Date().toISOString().split('T')[0];

  if (calViewMode === 'daily') {
    const curStr = currentCalDate.toISOString().split('T')[0];
    const dayName = ['일','월','화','수','목','금','토'][currentCalDate.getDay()];
    const events = getDailyEvents(curStr);

    let html = `
    <div class="cal-header">
      <button class="btn btn-sm btn-ghost" onclick="navigateCal(-1)">◀ 이전날</button>
      <strong style="font-size:14px;color:var(--accent)" onclick="resetCalToToday()" style="cursor:pointer">
        ${curStr} (${dayName}) ${curStr === todayStr ? '[오늘]' : ''}
      </strong>
      <button class="btn btn-sm btn-ghost" onclick="navigateCal(1)">다음날 ▶</button>
    </div>`;

    if (events.length === 0) {
      html += '<div style="text-align:center;padding:30px;color:var(--text2)">해당 날짜에 일정이 없거나 완료한 기록이 없습니다.</div>';
    } else {
      html += events.map(e => `
        <div class="list-item" style="align-items:flex-start;flex-direction:column;gap:4px;">
          <span class="${e.type.includes('rollover') ? 'badge-rollover' : (e.type === 'done' ? 'badge-done' : 'badge-pending')}">
            ${e.type === 'done' ? '완료' : (e.type.includes('rollover') ? '미달성 이월' : '할 일')}
          </span>
          <div style="font-size:13px;line-height:1.4;">${e.text}</div>
        </div>
      `).join('');
    }
    list.innerHTML = html;
  } 
  else if (calViewMode === 'weekly') {
    const curr = new Date(currentCalDate);
    const dayOfWeek = curr.getDay();
    const first = curr.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1);
    
    const monday = new Date(curr.setDate(first));
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);

    const monStr = monday.toISOString().split('T')[0];
    const sunStr = sunday.toISOString().split('T')[0];

    let html = `
    <div class="cal-header">
      <button class="btn btn-sm btn-ghost" onclick="navigateCal(-1)">◀ 이전주</button>
      <strong style="font-size:13px;color:var(--accent)" onclick="resetCalToToday()" style="cursor:pointer">
        ${monStr} ~ ${sunStr}
      </strong>
      <button class="btn btn-sm btn-ghost" onclick="navigateCal(1)">다음주 ▶</button>
    </div>`;

    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      const dStr = d.toISOString().split('T')[0];
      const dayName = ['일','월','화','수','목','금','토'][d.getDay()];
      const events = getDailyEvents(dStr);

      html += `<div class="weekly-card">
        <div style="font-size:12px;font-weight:bold;color:${dStr===todayStr?'var(--accent)':'var(--text)'};margin-bottom:6px;">
          ${dStr} (${dayName}) ${dStr===todayStr?'[오늘]':''}
        </div>
        ${events.length > 0 
          ? events.map(e => `<div style="font-size:11px;color:${e.type==='done'?'var(--green)':'var(--text2)'};margin-top:2px;">• ${e.text}</div>`).join('') 
          : '<div style="font-size:11px;color:var(--text3);">기록 없음</div>'}
      </div>`;
    }
    list.innerHTML = html;
  } 
  else if (calViewMode === 'monthly') {
    const year = currentCalDate.getFullYear();
    const month = currentCalDate.getMonth();
    
    const firstDate = new Date(year, month, 1);
    const lastDate = new Date(year, month + 1, 0);
    
    const startDate = new Date(firstDate);
    const firstDay = firstDate.getDay();
    const dayDiff = firstDay === 0 ? 6 : firstDay - 1;
    startDate.setDate(startDate.getDate() - dayDiff);
    
    const endDate = new Date(lastDate);
    const lastDay = lastDate.getDay();
    const endDiff = lastDay === 0 ? 0 : 7 - lastDay;
    endDate.setDate(endDate.getDate() + endDiff);

    const schedules = getSchedules();

    let calendarWeeks = [];
    let curr = new Date(startDate);
    
    while (curr <= endDate) {
      let week = [];
      for (let i = 0; i < 7; i++) {
        const dStr = curr.toISOString().split('T')[0];
        week.push({
          dateObj: new Date(curr),
          dateStr: dStr,
          dayNum: curr.getDate(),
          isCurrentMonth: curr.getMonth() === month,
          isToday: dStr === todayStr
        });
        curr.setDate(curr.getDate() + 1);
      }
      calendarWeeks.push(week);
    }

    let html = `
    <div class="cal-header">
      <button class="btn btn-sm btn-ghost" onclick="navigateCal(-1)">◀ 이전달</button>
      <strong style="font-size:14px;color:var(--accent)" onclick="resetCalToToday()" style="cursor:pointer">${year}년 ${month + 1}월</strong>
      <button class="btn btn-sm btn-ghost" onclick="navigateCal(1)">다음달 ▶</button>
    </div>
    <div class="monthly-container">
      <div class="cal-grid-header">
        <div class="cal-day-head">월</div>
        <div class="cal-day-head">화</div>
        <div class="cal-day-head">수</div>
        <div class="cal-day-head">목</div>
        <div class="cal-day-head">금</div>
        <div class="cal-day-head" style="color:var(--accent)">토</div>
        <div class="cal-day-head" style="color:var(--red)">일</div>
      </div>
    `;

    calendarWeeks.forEach(week => {
      const weekStartStr = week[0].dateStr;
      const weekEndStr = week[6].dateStr;

      const weekSchedules = schedules.filter(s => s.start <= weekEndStr && s.end >= weekStartStr);

      html += `<div class="month-week-row">`;

      week.forEach((day) => {
        html += `
          <div class="month-cell ${day.isToday ? 'today' : ''} ${!day.isCurrentMonth ? 'other-month' : ''}" onclick="goToDailyView('${day.dateStr}')">
            <div class="date-num">${day.dayNum}</div>
          </div>
        `;
      });

      html += `<div class="gantt-bars-container">`;
      weekSchedules.slice(0, 3).forEach((s) => {
        let startCol = 0;
        let endCol = 6;

        for (let i = 0; i < 7; i++) {
          if (week[i].dateStr === s.start) startCol = i;
          if (week[i].dateStr === s.end) endCol = i;
        }

        if (s.start < weekStartStr) startCol = 0;
        if (s.end > weekEndStr) endCol = 6;

        const leftPercent = (startCol / 7) * 100;
        const widthPercent = ((endCol - startCol + 1) / 7) * 100;
        const isStart = s.start >= weekStartStr;
        const isEnd = s.end <= weekEndStr;

        html += `
          <div class="gantt-bar-slot">
            <div class="gantt-bar gantt-${s.subj} ${isStart ? 'gantt-start' : ''} ${isEnd ? 'gantt-end' : ''}" 
                 style="left: ${leftPercent}%; width: ${widthPercent}%;" 
                 title="${s.subj}: ${s.title}">
                 ${isStart ? s.title : ''}
            </div>
          </div>
        `;
      });
      html += `</div></div>`;
    });

    html += `</div>`;
    list.innerHTML = html;
  }
}

let targetProbKey = null;
let editingHistoryIndex = null;

function openProbModal(pKey, historyIndex = null) {
  targetProbKey = pKey;
  editingHistoryIndex = historyIndex;
  
  if (historyIndex !== null) {
    const records = getData();
    const item = records[pKey].history[historyIndex];
    document.getElementById('probModalTitle').textContent = '문제 기록 수정';
    document.getElementById('probRound').value = item.round || '1';
    document.getElementById('probStatus').value = item.status || 'O';
    document.getElementById('probDate').value = item.date || new Date().toISOString().split('T')[0];
    document.getElementById('probMemo').value = item.memo || '';
  } else {
    document.getElementById('probModalTitle').textContent = '문제 기록 추가';
    document.getElementById('probDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('probMemo').value = '';
  }
  document.getElementById('probModal').classList.add('open');
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function saveProbRecord() {
  if (!targetProbKey) return;
  const records = getData();
  const round = document.getElementById('probRound').value;
  const status = document.getElementById('probStatus').value;
  const date = document.getElementById('probDate').value;
  const memo = document.getElementById('probMemo').value;

  if (!records[targetProbKey]) records[targetProbKey] = { history: [] };

  if (editingHistoryIndex !== null) {
    const old = records[targetProbKey].history[editingHistoryIndex];
    records[targetProbKey].history[editingHistoryIndex] = { ...old, round, status, date, memo };
  } else {
    records[targetProbKey].history.push({ round, status, date, scheduledDate: date, memo });
  }

  let reviewDays = 0;
  if (status.includes('☆') || status.includes('★')) reviewDays = 2;
  else if (status.includes('♥') || status.includes('♡')) reviewDays = 7;
  else if (status.includes('△') || status.includes('▲')) reviewDays = 14;

  if (reviewDays > 0) {
    const baseDate = new Date(date);
    baseDate.setDate(baseDate.getDate() + reviewDays);
    const reviewDateStr = baseDate.toISOString().split('T')[0];
    const nextRound = String(Number(round) + 1);

    records[targetProbKey].history.push({
      round: nextRound,
      status: '미진행',
      date: reviewDateStr,
      scheduledDate: reviewDateStr,
      memo: `[자동 복습] ${round}회독 ${status} 오답 복습 (${reviewDays}일 후)`
    });

    alert(`[오답 복습 스케줄 생성]\n${reviewDays}일 후인 ${reviewDateStr}에 ${nextRound}회독 복습 할 일이 자동으로 생성되었습니다.`);
  }

  saveData(records);
  closeModal('probModal');
  renderStudy();
}

function deleteProbRecord(pKey, idx) {
  if (!confirm('이 기록을 삭제하시겠습니까?')) return;
  const records = getData();
  records[pKey].history.splice(idx, 1);
  saveData(records);
  renderStudy();
}

  } else {
    records[`${pathKey}|${input}`] = records[`${pathKey}|${input}`] || { history: [] };
  }
  saveData(records);
  renderStudy();
}

function deleteProblem(pKey) {

}

function moveItem(depth, path, index, direction) {
  const struct = getStructure();
  let target;
  if (depth === 0) target = struct;
  else if (depth === 1) target = struct[path[0]];
  else if (depth === 2) target = struct[path[0]][path[1]];
  else if (depth === 3) target = struct[path[0]][path[1]][path[2]];

  if (Array.isArray(target)) {
    const newIdx = index + direction;
    if (newIdx < 0 || newIdx >= target.length) return;
    const temp = target[index];
    target[index] = target[newIdx];
    target[newIdx] = temp;
  } else {
    const keys = Object.keys(target);
    const newIdx = index + direction;
    if (newIdx < 0 || newIdx >= keys.length) return;
    const newObj = {};
    const keyToMove = keys[index];
    keys.splice(index, 1);
    keys.splice(newIdx, 0, keyToMove);
    keys.forEach(k => { newObj[k] = target[k]; });

    if (depth === 0) saveStructure(newObj);
    else if (depth === 1) struct[path[0]] = newObj;
    else if (depth === 2) struct[path[0]][path[1]] = newObj;
  }
  saveStructure(struct);
  renderStudy();
}

function exportData() {
  const data = {
    struct: getStructure(),
    records: getData(),
    schedules: getSchedules(),
    matrix: getProgressMatrix()
  };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `CPA_Tracker_Backup_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const reader = new FileReader();
    reader.onload = event => {
      try {
        const parsed = JSON.parse(event.target.result);
        if (parsed.struct) saveStructure(parsed.struct);
        if (parsed.records) saveData(parsed.records);
        if (parsed.schedules) saveSchedules(parsed.schedules);
        if (parsed.matrix) saveProgressMatrix(parsed.matrix);
        alert('복구가 완료되었습니다!');
        location.reload();
      } catch (err) { alert('백업 파일 형식이 올바르지 않습니다.'); }
    };
    reader.readAsText(event.target.files[0]);
  };
  input.click();
}
